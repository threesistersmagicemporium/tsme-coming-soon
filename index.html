
<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three Sisters Magic Emporium — Coming Soon</title>

  <meta
    name="description"
    content="Three Sisters Magic Emporium — Coming Soon. Where Magic Begins."
  >

  <meta name="theme-color" content="#08040a">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #08040a;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
  width: 100%;
  min-height: 100svh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 50% 30%, #1a0820 0%, #0f0613 45%, #08040a 100%);
}

    .art {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      max-height: 100svh;
      object-fit: contain;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .page {
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .art {
        width: 100%;
        height: auto;
        max-width: 100%;
        max-height: none;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>
  <main class="page" aria-label="Three Sisters Magic Emporium coming soon page">
    <img
      class="art"
      src="coming-soon.png"
      alt="Three Sisters Magic Emporium. Where Magic Begins. Coming Soon."
    >

    <section class="sr-only">
      <h1>Three Sisters Magic Emporium</h1>
      <p>Where Magic Begins.</p>
      <h2>Coming Soon</h2>
      <p>Our online store is currently being prepared.</p>
      <p>
        A magical range of crystals, gifts, spellbinding treasures
        and so much more will be with you soon.
      </p>
    </section>
  </main>
</body>
</html>
