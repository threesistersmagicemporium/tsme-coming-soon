<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Three Sisters Magic Emporium — Coming Soon</title>

  <meta
    name="description"
    content="Three Sisters Magic Emporium — Coming Soon. Where Magic Begins."
  >

  <meta name="theme-color" content="#08040a">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #08040a;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #08040a;
    }

    picture {
      display: block;
      width: 100%;
      height: 100%;
    }

    .art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Desktop / landscape screens */
    @media (orientation: landscape) {
      .art {
        object-fit: contain;
      }
    }

    /* Phones / portrait screens */
    @media (orientation: portrait) {
      .art {
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

  <main
    class="page"
    aria-label="Three Sisters Magic Emporium coming soon page"
  >

    <picture>

      <!-- Phone / portrait artwork -->
      <source
        media="(orientation: portrait)"
        srcset="coming-soon-mobile.png"
      >

      <!-- Desktop / landscape artwork -->
      <img
        class="art"
        src="coming-soon.png"
        alt="Three Sisters Magic Emporium. Where Magic Begins. Coming Soon."
      >

    </picture>

    <section class="sr-only">
      <h1>Three Sisters Magic Emporium</h1>
      <p>Where Magic Begins.</p>

      <h2>Coming Soon</h2>

      <p>
        Our online store is currently being prepared.
      </p>

      <p>
        A magical range of crystals, gifts,
        spellbinding treasures and so much more
        will be with you soon.
      </p>
    </section>

  </main>

</body>
</html>
